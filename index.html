<!DOCTYPE html>
<html>
	<head>
		<title>Rock-Paper-Scissors</title>
		<link rel="stylesheet" href="styles/12-rock-paper-scissors.css">	
	</head>
	
	<body>
		<div class="game-container">
			<p class="title">Rock Paper Scissors</p>

			<p>pick your move:</p>
			
			<button class="move-button js-rock-button"><img src="emoji/Rock-emoji.png"></button>
			
			<button class="move-button js-paper-button"><img src="emoji/Paper-emoji.png"></button>
			
			<button class="move-button js-scissors-button"><img src="emoji/Scissors-emoji.png"></button>

			<p class="js-result result"></p>
			<p class="js-moves"></p>
			<p class="js-score score"></p>

			<button class="reset-score-button" onclick="
				score.wins = 0;
				score.losses = 0;
				score.draw = 0;
				localStorage.removeItem('score');
				updateScoreElement();
			">Reset Score</button>

			<button class="auto-play-button" onclick="
			autoplay();
			">Autoplay</button>
		</div>
		<script src="scripts/12-rock-paper-scissors.js"></script>	
	</body>
</html>
